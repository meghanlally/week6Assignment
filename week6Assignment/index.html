<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meghan Lally - Assignment 5</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css">
    <style>
        html, body {
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #header {
            box-sizing: border-box;
            height: 180px;
            padding: 12px 16px;
            background: #fff8e8;
            color: #382a1f;
            border-bottom: 3px solid #79552f;
        }

        h1 { font-size: 20px; margin: 0 0 8px; }
        p { font-size: 14px; margin: 6px 0; }
        label, input, button { font-size: 14px; }
        input { width: 145px; padding: 6px; }
        button { padding: 6px 10px; cursor: pointer; }
        #message { min-height: 18px; }
        #map { width: 100%; height: calc(100% - 180px); }

        @media (max-width: 480px) {
            #header { height: 225px; padding: 10px; }
            #map { height: calc(100% - 225px); }
            label { display: block; margin-bottom: 4px; }
        }
    </style>
    <script src="obj.js"></script>
    <script type="module" src="map.js"></script>
</head>
<body>
    <div id="header">
        <h1>Meghan Lally - Assignment 5</h1>
        <p>My home, university, favorite vacation spot, wedding, and hometown.</p>
        <form id="citySearch">
            <label for="cityInput">City name:</label>
            <input id="cityInput" list="cityList" placeholder="Try Savery" disabled>
            <datalist id="cityList"></datalist>
            <button type="submit" id="searchButton" disabled>Search</button>
            <button type="button" id="resetMap" disabled>Reset</button>
        </form>
        <p id="message" role="status">Loading the map...</p>
        <p>Orange squares are places. Blue squares are clusters. Click either to zoom in.</p>
    </div>
    <div id="map" aria-label="3D map of my places"></div>
</body>
</html>
